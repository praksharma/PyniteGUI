name: Build macOS Desktop Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Build wheel and an isolated, locked runtime
        run: |
          uv build --no-sources
          uv export --locked --no-dev --extra mcp --no-emit-project --format requirements-txt --output-file desktop-runtime.txt
          uv venv --python 3.12 build/desktop-env
          uv pip install --python build/desktop-env/bin/python -r desktop-runtime.txt -r desktop/requirements.txt dist/*.whl
      - name: Run packaging checks
        run: |
          build/desktop-env/bin/python -B scripts/test.py release tooling
      - name: Freeze the reviewed installed wheel
        run: |
          build/desktop-env/bin/python -B scripts/build_desktop.py --wheel dist/*.whl --source dist/*.tar.gz --output dist/desktop
      - name: Extract and check the app without external Python paths
        env:
          PYNITEGUI_NO_WEBENGINE: "0"
          QT_QPA_PLATFORM: cocoa
        run: |
          mkdir -p build/relocated
          ditto -x -k dist/desktop/Brecon-*.zip build/relocated
          env -u PYTHONHOME -u PYTHONPATH PATH=/usr/bin:/bin:/usr/sbin:/sbin build/relocated/Brecon.app/Contents/MacOS/Brecon --desktop-check "$PWD/build/desktop-check"
          build/desktop-env/bin/python -B scripts/check_desktop.py build/relocated/Brecon.app build/desktop-check/desktop-check.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: brecon-macos-desktop-preview
          path: |
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS
            dist/desktop/build-info.json
            build/desktop-check/
          if-no-files-found: error
          retention-days: 14
