]

[external.viewport-frame]
description = "Real offline 3D frame interaction/rendering checks."
scripts = ["tests/viewport3d.spec.cjs"]

[external.viewport-surfaces]
description = "Real surface rendering and enclosed/crossing box-selection checks."
scripts = ["tests/mesh_viewport.spec.cjs"]

[external.viewport]
description = "Both offline viewport suites (separate Playwright/Chromium installation required)."
scripts = ["tests/viewport3d.spec.cjs", "tests/mesh_viewport.spec.cjs"]
