[project]
name = "pynitegui"
version = "0.1.0"
description = "A Qt desktop editor for 2D frame analysis with PyNite."
readme = "README.md"
authors = [
    { name = "Prakhar" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pynitefea>=3.0.0",
]

[project.scripts]
pynitegui = "pynitegui:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
