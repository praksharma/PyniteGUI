<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyniteGUI Spatial Frame</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fafcfc}canvas{display:block;width:100%;height:100%;touch-action:none}#error{position:absolute;inset:16px;font:14px sans-serif;color:#bd3549;white-space:pre-wrap;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>#orientation-gizmo{position:absolute;right:0;bottom:0;width:128px;height:128px;touch-action:none;cursor:pointer}#orientation-gizmo:focus-visible{outline:2px solid #3786bd;outline-offset:-2px}.gizmo-home{position:absolute;right:6px;top:2px;border:1px solid #7d8c95;background:#f4f8fa;color:#24333c;border-radius:3px;height:24px;padding:0 5px;font:11px sans-serif;cursor:pointer}.gizmo-home:hover{background:#d6edf0}#error{z-index:2}</style>
</head><body><div id="error" role="alert"></div>
<style>#selection-box{position:absolute;box-sizing:border-box;border:1px solid #168b8b;background:rgba(120,160,165,.12);pointer-events:none}</style>
<style>#result-legend{position:absolute;left:12px;top:12px;padding:8px 10px;font:12px/18px sans-serif;max-width:calc(100% - 44px);pointer-events:none;opacity:.95;overflow-wrap:anywhere}</style>
<style>#support-tooltip{position:absolute;z-index:3;pointer-events:none;border:1px solid;padding:9px 11px;border-radius:4px;max-width:calc(100% - 40px);font:12px/18px sans-serif;overflow-wrap:anywhere}#support-tooltip[hidden]{display:none}#support-tooltip table{border-spacing:0;margin-top:4px}#support-tooltip td{padding:1px 8px 1px 0;vertical-align:top}#support-tooltip .active-dof{font-weight:bold;text-decoration:underline}</style>
<script>
window.pyniteBridge=null;window.pyniteRendererReady=false;window.pyniteFailure=null;
window.pyniteReportFailure=message=>{window.pyniteFailure=message;document.getElementById('error').textContent='3D renderer could not start: '+message;window.pyniteBridge?.failed(message);};
addEventListener('error',event=>window.pyniteReportFailure(event.message));
if(window.qt){const script=document.createElement('script');script.src='qrc:///qtwebchannel/qwebchannel.js';script.onload=()=>new QWebChannel(qt.webChannelTransport,channel=>{window.pyniteBridge=channel.objects.bridge;if(window.pyniteFailure)window.pyniteBridge.failed(window.pyniteFailure);else if(window.pyniteRendererReady)window.pyniteBridge.ready();});document.head.appendChild(script);}
</script>
<script type="module" src="viewer.js"></script></body></html>
